server {
 # Replace this example address with your own NAS LAN address.
 listen 192.168.1.10:9080;
 server_name 192.168.1.10;
 root /volume1/web/read-local;
 index index.html;
 client_max_body_size 8m;
 add_header X-Content-Type-Options nosniff;
 location ^~ /api/ {
  include /etc/nginx/fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /volume1/web/read-local/api.php;
  fastcgi_param HTTP_AUTHORIZATION $http_authorization;
  fastcgi_pass unix:/run/read-local.sock;
  fastcgi_read_timeout 300s;
 }
 location ~ \.php$ { return 404; }
 location ~ \.mjs$ {
  types { application/javascript mjs; }
  try_files $uri =404;
 }
 location ~ \.wasm$ {
  types { application/wasm wasm; }
  try_files $uri =404;
 }
 location / { try_files $uri $uri/ /index.html; }
}
